[workspace]
resolver = "2"
members = [
  "contracts/*",
  "packages/*",
]

[workspace.package]
version = "0.0.1"
authors = ["kiruse"]
edition = "2024"

[workspace.dependencies]
# CosmWasm dependencies with version features
cosmwasm-schema = { version = "3", default-features = false }
cosmwasm-std = { version = "3", default-features = false }
cw-storage-plus = { version = "3", default-features = false }
cw-utils = { version = "3", default-features = false }
cw2 = { version = "3", default-features = false }

# Common dependencies
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = { version = "1.0" }

[workspace.features]
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm-std/cosmwasm_2_1"]
cosmwasm_2_2 = ["cosmwasm-std/cosmwasm_2_2"]
cosmwasm_3_0 = ["cosmwasm-std/cosmwasm_3_0"]

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true
