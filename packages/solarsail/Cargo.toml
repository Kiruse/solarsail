[package]
name = "solarsail"
version = "0.0.1"
authors = ["kiruse"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# CosmWasm version features
cosmwasm_1_1 = ["cosmwasm-std/cosmwasm_1_1"]
cosmwasm_1_2 = ["cosmwasm-std/cosmwasm_1_2"]
cosmwasm_1_3 = ["cosmwasm-std/cosmwasm_1_3"]
cosmwasm_1_4 = ["cosmwasm-std/cosmwasm_1_4"]
cosmwasm_2_0 = ["cosmwasm-std/cosmwasm_2_0"]
cosmwasm_2_1 = ["cosmwasm-std/cosmwasm_2_1"]
cosmwasm_2_2 = ["cosmwasm-std/cosmwasm_2_2"]
cosmwasm_3_0 = ["cosmwasm-std/cosmwasm_3_0"]

[dependencies]
cosmwasm-schema.workspace = true
cosmwasm-std.workspace = true
cw-storage-plus.workspace = true
cw2.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true

solarsail-macros = { version = "0.0.1", path = "../solarsail-macros" }
